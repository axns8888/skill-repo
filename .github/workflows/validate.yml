name: Validate and publish skills
on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['skills-v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional: publish this verified commit as skills-vYYYY.MM.DD.N'
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify committed snapshot and run regression tests
        run: npm run release:check
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: skills-release-${{ inputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Publish the exact verified commit without replacing existing versions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^skills-v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo 'Expected skills-vYYYY.MM.DD.N' >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG"; then
            echo 'This version already exists; choose a new version.' >&2
            exit 1
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then exit "$status"; fi
          fi
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
